name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Force npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Debug npm registry sources
        run: |
          echo "userconfig=$(npm config get userconfig)"
          echo "globalconfig=$(npm config get globalconfig)"
          echo "registry=$(npm config get registry)"
          node -e 'for (const key of Object.keys(process.env).sort()) { if (/^(NPM|NODE)_/.test(key) || /^npm_config_/i.test(key)) { const lower = key.toLowerCase(); const sensitive = /(token|auth|password|secret)/.test(lower); console.log(`${key}=${sensitive ? "***" : process.env[key]}`); } }'

      - name: Install dependencies
        env:
          NPM_CONFIG_CACHE: /tmp/npm-cache
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm ci --verbose --no-audit --no-fund --foreground-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          CI: "true"
          APP_MODE: mock
          PORT: "5179"
        run: npm test
