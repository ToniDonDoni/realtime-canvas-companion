name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --verbose

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          CI: "true"
          APP_MODE: mock
          PORT: "5179"
        run: npm test
